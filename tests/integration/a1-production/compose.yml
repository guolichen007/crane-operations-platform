# Test-only overlay. Named volumes enforce Linux ownership even on Windows bind mounts.
services:
  postgres:
    secrets: !reset []
    volumes:
      - a1-fixture:/fixture:ro
      - a1-fixture:/run/secrets:ro
      - ../../tests/integration/a1-production/postgres-entrypoint.sh:/opt/crane/a1-postgres-entrypoint.sh:ro
    environment:
      POSTGRES_PASSWORD_FILE: /fixture/secrets/postgres_admin_password
    entrypoint: [/bin/sh, /opt/crane/a1-postgres-entrypoint.sh]
  keycloak:
    secrets: !reset []
    volumes: [a1-fixture:/fixture:ro, a1-fixture:/run/secrets:ro]
  mosquitto:
    volumes: !override
      - ../mosquitto/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - a1-fixture:/fixture:ro
      - a1-mqtt:/mosquitto/data
    command: [mosquitto, -c, /fixture/mosquitto.conf]
  cloud-api:
    secrets: !reset []
    environment:
      OIDC_CLIENT_SECRET_FILE: /fixture/secrets/oidc_client_secret
      SESSION_SECRET_FILE: /fixture/secrets/session_server_secret
      DATABASE_PASSWORD_FILE: /fixture/secrets/app_db_password
      INVENTORY_FILE: /fixture/inventory.json
      FLEET_FILE: /fixture/fleet.json
      CERT_DIR: /fixture/cloud
      SSL_CERT_FILE: /fixture/ingress/ca.crt
    volumes: !override
      - a1-fixture:/fixture:ro
    depends_on:
      ingress: {condition: service_started}
  fixture-init:
    image: alpine:3.23
    profiles: [tests]
    entrypoint: [/bin/sh, /setup/init.sh]
    volumes:
      - ${A1_PROD_FIXTURE_DIR:?private fixture directory}:/input:ro
      - ../../tests/integration/a1-production:/setup:ro
      - a1-fixture:/fixture
  fixture-tool:
    image: ${CRANE_CLOUD_IMAGE}
    profiles: [tests]
    user: "0:0"
    entrypoint: [/fixture/a1-fixture]
    environment:
      OIDC_ISSUER: ${CRANE_AUTH_URL}/realms/crane
    volumes: [a1-fixture:/fixture:ro]
    networks: [backend]
  provisioner:
    image: ${CRANE_CLOUD_IMAGE}
    profiles: [tests]
    user: "0:0"
    entrypoint: [provision-keycloak]
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      PUBLIC_URL: ${CRANE_PUBLIC_URL}
      KEYCLOAK_BOOTSTRAP_PASSWORD_FILE: /fixture/secrets/keycloak_bootstrap_password
      OIDC_CLIENT_SECRET_FILE: /fixture/secrets/oidc_client_secret
      KEYCLOAK_REALM_TEMPLATE: /template/realm.template.json
    volumes: [a1-fixture:/fixture:ro, ../production/realm.template.json:/template/realm.template.json:ro]
    networks: [backend]
  ingress:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${A1_WEB_PORT}:${A1_WEB_PORT}"
      - "127.0.0.1:${A1_AUTH_PORT}:${A1_AUTH_PORT}"
    volumes: [a1-fixture:/fixture:ro]
    command: [nginx, -c, /fixture/ingress.conf, -g, "daemon off;"]
    networks:
      frontend: {aliases: [crane.test, auth.crane.test]}
    depends_on:
      keycloak: {condition: service_healthy}
volumes:
  a1-fixture:
  a1-mqtt:
