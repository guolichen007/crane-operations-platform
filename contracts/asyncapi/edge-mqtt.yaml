      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "edge-to-cloud"
    },
    "channel5": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/command/watch/start",
      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "cloud-to-edge"
    },
    "channel6": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/command/watch/renew",
      "parameters": {
