    "channel7": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/command/watch/stop",
      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "cloud-to-edge"
    },
    "channel8": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/command/ack",
      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "edge-to-cloud"
    }
  },
  "operations": {
    "channel0": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel0"
      },
      "bindings": {
        "mqtt": {
          "qos": 0,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel1": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel1"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel2": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel2"
      },
      "bindings": {
        "mqtt": {
          "qos": 0,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel3": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel3"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel4": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel4"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel5": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/channel5"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel6": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/channel6"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel7": {
      "action": "send",
      "channel": {
        "$ref": "#/channels/channel7"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    },
    "channel8": {
      "action": "receive",
      "channel": {
        "$ref": "#/channels/channel8"
      },
      "bindings": {
        "mqtt": {
          "qos": 1,
          "bindingVersion": "0.2.0"
        }
      }
    }
  },
  "components": {
    "messages": {
      "Message": {
        "payload": {
          "schemaFormat": "application/schema+json;version=draft-07",
          "schema": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "schemaVersion",
              "messageId",
              "tenantId",
              "projectId",
              "deviceId",
              "bootId",
              "sequence",
              "timestamp",
              "kind",
              "connectivity",
              "edgeHealth",
              "controllerHealth",
              "sensorHealth",
              "operatingState",
              "mode",
              "alarmState",
              "softwareVersion",
              "runtimeTotal",
              "x",
              "y",
              "z",
              "load",
              "sessionId",
              "ttlSeconds",
              "telemetryHz",
              "code",
              "text"
            ],
            "properties": {
              "schemaVersion": {
                "const": 1
              },
              "messageId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,80}$"
              },
              "tenantId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,80}$"
              },
              "projectId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,80}$"
              },
              "deviceId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,80}$"
              },
              "bootId": {
                "type": "string",
                "pattern": "^[A-Za-z0-9_-]{1,80}$"
              },
              "sequence": {
                "type": "integer",
                "minimum": 0
              },
              "timestamp": {
                "type": "string",
                "format": "date-time"
              },
              "kind": {
                "type": "string",
                "enum": [
                  "BIRTH",
                  "LWT",
                  "HEARTBEAT",
                  "SNAPSHOT",
                  "LIVE",
                  "ALARM",
                  "EVENT",
                  "WATCH_START",
                  "WATCH_RENEW",
                  "WATCH_STOP",
                  "WATCH_ACK"
                ]
              },
              "connectivity": {
                "type": "string"
              },
              "edgeHealth": {
                "type": "string"
              },
              "controllerHealth": {
                "type": "string"
              },
              "sensorHealth": {
                "type": "string"
              },
              "operatingState": {
                "type": "string"
              },
              "mode": {
                "type": "string"
              },
              "alarmState": {
                "type": "string"
              },
              "softwareVersion": {
                "type": "string"
              },
              "runtimeTotal": {
                "type": "number"
              },
              "x": {
                "type": "number"
              },
              "y": {
                "type": "number"
              },
              "z": {
                "type": "number"
              },
              "load": {
                "type": "number"
              },
              "sessionId": {
                "type": "string"
              },
              "ttlSeconds": {
                "type": "integer"
              },
              "telemetryHz": {
                "type": "integer"
              },
              "code": {
                "type": "string"
              },
              "text": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "securitySchemes": {
      "deviceCertificate": {
        "type": "X509"
      }
    }
  }
}
