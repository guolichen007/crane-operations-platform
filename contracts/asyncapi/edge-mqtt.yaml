{
  "asyncapi": "3.0.0",
  "info": {
    "title": "Crane Edge MQTT",
    "version": "1.0.0"
  },
  "servers": {
    "dev": {
      "host": "mosquitto:8883",
      "protocol": "mqtts",
      "protocolVersion": "5",
      "security": [
        {
          "$ref": "#/components/securitySchemes/deviceCertificate"
        }
      ]
    }
  },
  "channels": {
    "channel0": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/heartbeat",
      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "edge-to-cloud"
    },
    "channel1": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/shadow/reported",
      "parameters": {
        "tenantId": {},
        "projectId": {},
        "deviceId": {}
      },
      "messages": {
        "message": {
          "$ref": "#/components/messages/Message"
        }
      },
      "x-direction": "edge-to-cloud"
    },
    "channel2": {
      "address": "crane/v1/{tenantId}/{projectId}/{deviceId}/telemetry/live",
