          "name",
          "version"
        ]
      },
      "StaffTeamList": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StaffTeam"
            }
          }
        },
        "required": [
