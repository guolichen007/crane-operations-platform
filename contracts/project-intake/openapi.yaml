    "/api/v1/stage-summary": {
      "get": {
        "operationId": "stage.summary",
        "summary": "当前角色授权范围内 12 个销售阶段的真实数量与项目预估金额",
        "description": "一条 PostgreSQL 聚合，范围与 GET /projects 相同（ProjectPolicy/projectScope），默认包含范围内全部报备状态。基础筛选 q/status/province/updatedAfter 与 /projects 同义并作用于全部阶段；stage、分页、排序、跟进窗口等其他参数一律 400 INVALID_FILTER。同一数据状态下，每个阶段 count 等于 GET /projects?stage=<code>&<相同筛选> 的 total。G3-3B 增加每阶段、非标准阶段与全局的 amount（同一条 SQL、同一快照），只统计预估金额的已知部分。",
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "客户、项目名称或报备编号"
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "DRAFT",
                "SUBMITTED",
                "UNDER_REVIEW",
                "APPROVED",
                "RETURNED",
                "REJECTED",
                "EXPIRED",
                "CANCELLED",
                "CONVERTED"
              ]
            },
            "description": "报备状态（intake_status）"
          },
          {
            "name": "province",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "updatedAfter",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "scope",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "mine",
                "team",
                "member",
                "all"
              ]
            },
            "description": "V1.1 分层范围（服务端白名单）：销售 mine；主管 team/mine/member（仅本团队成员）；总监与管理员 all/team/member。总与 projectScope 取交集，只能缩小。"
          },
          {
            "name": "memberId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=member 时的人员编号（staff id）；不可见或不存在一律 404 SCOPE_NOT_FOUND"
          },
          {
            "name": "teamId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=team 时的团队；主管只能是本团队（可省略），总监/管理员必填"
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StageSummary"
                }
              }
            }
          },
          "400": {
            "description": "未知参数、重复参数或非法取值（INVALID_FILTER）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "503": {
            "description": "服务暂不可用"
          },
          "403": {
            "description": "SCOPE_FORBIDDEN：角色无此统计范围",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "SCOPE_NOT_FOUND：成员/团队不存在或不可见（不区分）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
