          "id",
          "number",
          "name",
          "status",
          "version",
          "queued"
        ]
      },
      "StaffDetail": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "member": {
            "$ref": "#/components/schemas/StaffMember"
