            "minimum": 1
          },
          "note": {
            "type": "string"
          },
          "permissions": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StaffCapability"
            },
            "uniqueItems": true,
            "maxItems": 3
          },
          "projectCount": {
            "type": "integer",
            "minimum": 0
          },
          "lastLogin": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "syncStatus": {
            "type": "string",
            "enum": [
              "NONE",
              "PENDING",
              "ACKNOWLEDGED",
              "FAILED",
              "SUPERSEDED"
            ]
          },
          "canManage": {
            "type": "boolean"
          },
          "identityLinked": {
            "type": "boolean",
            "description": "存在格式有效的已绑定企业身份标识。响应不返回标识原值。"
          },
          "identityVerified": {
            "type": "boolean",
            "description": "活动账号具有精确企业身份、工作邮箱及签名登录激活记录。"
          },
          "roleChanged": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "name",
          "email",
          "teamId",
          "team",
          "role",
          "status",
          "version",
          "note",
          "permissions",
          "projectCount",
          "lastLogin",
          "syncStatus",
          "canManage",
          "identityLinked",
          "identityVerified",
          "roleChanged"
        ]
      },
      "StaffPage": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/StaffMember"
