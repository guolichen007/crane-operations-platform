    "/api/v1/me": {
      "get": {
        "operationId": "me",
        "summary": "me",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "permissions",
                    "businessActions"
                  ],
                  "properties": {
                    "permissions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/StaffCapability"
                      }
                    },
                    "businessActions": {
                      "type": "object",
                      "additionalProperties": {
                        "$ref": "#/components/schemas/ActionHint"
                      }
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "输入错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "缺少会话 Cookie（UNAUTHENTICATED）或会话已失效（SESSION_EXPIRED）"
          },
          "403": {
            "description": "权限或CSRF不允许"
          },
          "404": {
            "description": "不可见或不存在"
          },
          "409": {
            "description": "版本或状态冲突"
          },
          "503": {
            "description": "服务暂不可用；输入保留，可重试"
          }
        }
      }
    },
