                "version": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "required": [
                "id",
                "status"
              ]
            }
          }
        },
        "required": [
          "items"
        ]
      },
      "StaffTeam": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          }
        },
        "required": [
