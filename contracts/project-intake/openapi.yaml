    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "__Host-baobei_session"
      }
    },
    "schemas": {
      "ProjectInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "projectName": {
            "type": "string",
            "maxLength": 200
          },
          "customer": {
            "type": "string",
            "maxLength": 200
          },
          "location": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "province": {
                "type": "string",
                "maxLength": 300
              },
              "city": {
                "type": "string",
                "maxLength": 300
              },
              "district": {
                "type": "string",
                "maxLength": 300
              },
              "industrialPark": {
                "type": "string",
                "maxLength": 300
              },
              "factoryName": {
                "type": "string",
                "maxLength": 300
              },
              "workshop": {
                "type": "string",
                "maxLength": 300
              },
              "addressDetail": {
                "type": "string",
                "maxLength": 300
              }
            }
          },
          "salesStage": {
            "type": "string",
            "enum": [
              "L0_LEAD",
              "L1_REQUIREMENT",
              "L2_TECHNICAL",
              "L3_SITE_SURVEY",
              "L4_SOLUTION",
              "L5_QUOTATION",
              "L6_TENDER",
              "L7_COMMERCIAL",
              "L8_PENDING_CONTRACT",
              "WON",
              "LOST",
              "HOLD"
            ]
          },
          "projectType": {
            "type": "string",
            "enum": [
              "",
              "NEW_BUILD",
              "RETROFIT",
              "EXPANSION"
            ]
          },
          "informationSource": {
            "type": "string"
          },
          "confidenceLevel": {
            "type": "string"
          },
          "estimatedAmount": {
            "type": "number",
            "minimum": 0,
            "maximum": 100000000000000,
