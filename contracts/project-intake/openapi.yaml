    "/api/v1/stage-summary": {
      "get": {
        "operationId": "stage.summary",
        "summary": "当前角色授权范围内 12 个销售阶段的真实数量与项目预估金额",
        "description": "一条 PostgreSQL 聚合，范围与 GET /projects 相同（ProjectPolicy/projectScope），默认包含范围内全部报备状态。基础筛选 q/status/province/updatedAfter 与 /projects 同义并作用于全部阶段；stage、分页、排序、跟进窗口等其他参数一律 400 INVALID_FILTER。同一数据状态下，每个阶段 count 等于 GET /projects?stage=<code>&<相同筛选> 的 total。G3-3B 增加每阶段、非标准阶段与全局的 amount（同一条 SQL、同一快照），只统计预估金额的已知部分。",
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "客户、项目名称或报备编号"
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "DRAFT",
                "SUBMITTED",
                "UNDER_REVIEW",
                "APPROVED",
                "RETURNED",
                "REJECTED",
                "EXPIRED",
                "CANCELLED",
                "CONVERTED"
              ]
            },
            "description": "报备状态（intake_status）"
          },
          {
            "name": "province",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "updatedAfter",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/StageSummary"
                }
              }
            }
          },
          "400": {
            "description": "未知参数、重复参数或非法取值（INVALID_FILTER）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "503": {
            "description": "服务暂不可用"
          }
        }
      }
    },
