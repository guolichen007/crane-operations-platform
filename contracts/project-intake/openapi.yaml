                    }
                  },
                  "salesStage": {
                    "type": "string",
                    "enum": [
                      "L0_LEAD",
                      "L1_REQUIREMENT",
                      "L2_TECHNICAL",
                      "L3_SITE_SURVEY",
                      "L4_SOLUTION",
                      "L5_QUOTATION",
                      "L6_TENDER",
                      "L7_COMMERCIAL",
                      "L8_PENDING_CONTRACT",
                      "WON",
                      "LOST",
                      "HOLD"
                    ]
                  },
                  "projectType": {
                    "type": "string"
                  },
                  "informationSource": {
                    "type": "string"
                  },
                  "confidenceLevel": {
                    "type": "string"
                  },
                  "estimatedAmount": {
                    "type": "number",
                    "minimum": 0,
                    "nullable": true
                  },
                  "expectedPurchaseDate": {
                    "type": "string"
                  },
                  "requirements": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "requirementNotes": {
                    "type": "string",
                    "maxLength": 4000
                  },
                  "plannedEquipment": {
                    "type": "array",
                    "items": {
                      "type": "object"
                    }
                  },
                  "parties": {
                    "type": "array",
                    "items": {
                      "type": "object"
                    }
                  },
                  "tenderNo": {
                    "type": "string"
                  },
                  "notes": {
                    "type": "string",
                    "maxLength": 4000
                  },
                  "knowledge": {
                    "$ref": "#/components/schemas/Knowledge"
                  },
                  "nextAction": {
                    "type": "string",
                    "maxLength": 3000
                  },
                  "nextFollowupAt": {
                    "type": "string",
                    "format": "date-time",
                    "nullable": true
                  },
                  "assignmentMode": {
                    "type": "string",
                    "enum": [
                      "UNASSIGNED_DRAFT",
                      "ASSIGN_ACTIVE_SALES"
                    ],
                    "description": "仅admin；省略时未分配"
                  },
                  "targetSubject": {
                    "type": "string",
                    "description": "仅admin指派模式；必须来自有效销售候选"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Project"
                }
              }
            }
          },
          "400": {
            "description": "输入错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "权限或CSRF不允许"
          },
          "404": {
            "description": "不可见或不存在"
          },
          "409": {
            "description": "版本或状态冲突"
          },
          "503": {
            "description": "服务暂不可用；输入保留，可重试"
          }
        },
        "parameters": [
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "GET /api/v1/me 的会话绑定 CSRF；同时需要同源 Origin"
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{16,128}$"
            },
            "description": "actor+key唯一，同内容返回原ID当前版本，不同内容409；不接受缺失键"
          }
        ]
      }
    },
