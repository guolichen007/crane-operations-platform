      "post": {
        "operationId": "projects.create",
        "summary": "projects.create",
        "security": [
          {
            "session": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "version": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "projectName": {
                    "type": "string",
                    "maxLength": 200
                  },
                  "customer": {
                    "type": "string",
                    "maxLength": 200
                  },
                  "location": {
                    "type": "object",
                    "additionalProperties": false,
                    "properties": {
                      "province": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "city": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "district": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "industrialPark": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "factoryName": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "workshop": {
                        "type": "string",
                        "maxLength": 300
                      },
                      "addressDetail": {
                        "type": "string",
                        "maxLength": 300
                      }
                    }
                  },
                  "salesStage": {
                    "type": "string",
                    "enum": [
                      "L0_LEAD",
                      "L1_REQUIREMENT",
                      "L2_TECHNICAL",
                      "L3_SITE_SURVEY",
                      "L4_SOLUTION",
                      "L5_QUOTATION",
                      "L6_TENDER",
                      "L7_COMMERCIAL",
                      "L8_PENDING_CONTRACT",
                      "WON",
                      "LOST",
                      "HOLD"
                    ]
                  },
                  "projectType": {
                    "type": "string"
                  },
                  "informationSource": {
                    "type": "string"
                  },
                  "confidenceLevel": {
                    "type": "string"
                  },
                  "estimatedAmount": {
                    "type": "number",
                    "minimum": 0,
                    "nullable": true
                  },
                  "expectedPurchaseDate": {
                    "type": "string"
                  },
                  "requirements": {
                    "type": "array",
                    "items": {
                      "type": "string"
                    }
                  },
                  "requirementNotes": {
                    "type": "string",
                    "maxLength": 4000
                  },
                  "plannedEquipment": {
                    "type": "array",
                    "items": {
                      "type": "object"
                    }
                  },
                  "parties": {
                    "type": "array",
                    "items": {
                      "type": "object"
                    }
                  },
                  "tenderNo": {
                    "type": "string"
                  },
                  "notes": {
                    "type": "string",
                    "maxLength": 4000
                  },
                  "knowledge": {
                    "$ref": "#/components/schemas/Knowledge"
                  },
                  "nextAction": {
                    "type": "string",
                    "maxLength": 3000
                  },
                  "nextFollowupAt": {
                    "type": "string",
                    "format": "date-time",
                    "nullable": true
                  },
                  "assignmentMode": {
                    "type": "string",
                    "enum": [
                      "UNASSIGNED_DRAFT",
                      "ASSIGN_ACTIVE_SALES"
                    ],
                    "description": "仅admin；省略时未分配"
                  },
                  "targetSubject": {
                    "type": "string",
                    "description": "仅admin指派模式；必须来自有效销售候选"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Project"
                }
              }
            }
          },
          "400": {
            "description": "输入错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
