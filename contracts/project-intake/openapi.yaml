    "/api/v1/analytics/overview": {
      "get": {
        "operationId": "analytics.overview",
        "summary": "V1.1 分层统计总览（本人/成员/团队/全局）",
        "description": "同一 REPEATABLE READ 快照：12 阶段与金额（同 stage-summary）、六组、报备状态与跟进计数。项目集合与 GET /projects 同参数严格一致。",
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "客户、项目名称或报备编号"
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "DRAFT",
                "SUBMITTED",
                "UNDER_REVIEW",
                "APPROVED",
                "RETURNED",
                "REJECTED",
                "EXPIRED",
                "CANCELLED",
                "CONVERTED"
              ]
            },
            "description": "报备状态（intake_status）"
          },
          {
            "name": "province",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "updatedAfter",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "scope",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "mine",
                "team",
                "member",
                "all"
              ]
            },
            "description": "V1.1 分层范围（服务端白名单）：销售 mine；主管 team/mine/member（仅本团队成员）；总监与管理员 all/team/member。总与 projectScope 取交集，只能缩小。"
          },
          {
            "name": "memberId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=member 时的人员编号（staff id）；不可见或不存在一律 404 SCOPE_NOT_FOUND"
          },
          {
            "name": "teamId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=team 时的团队；主管只能是本团队（可省略），总监/管理员必填"
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AnalyticsOverview"
                }
              }
            }
          },
          "400": {
            "description": "INVALID_FILTER",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "SCOPE_FORBIDDEN：角色无此统计范围",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "SCOPE_NOT_FOUND：成员/团队不存在或不可见（不区分）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          }
        }
      }
