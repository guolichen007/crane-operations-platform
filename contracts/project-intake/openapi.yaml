          }
        },
        "required": [
          "member",
          "projects",
          "recentReauth"
        ]
      },
      "StaffAudit": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "actor": {
                  "type": "string"
                },
                "action": {
                  "type": "string"
                },
                "reason": {
                  "type": "string"
                },
                "version": {
                  "type": "integer",
                  "minimum": 1
                },
                "at": {
                  "type": "string",
                  "format": "date-time"
                }
              },
              "required": [
                "actor",
                "action",
                "reason",
                "version",
                "at"
              ]
            }
          }
        },
        "required": [
          "items"
        ]
      },
      "StaffTransfer": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "targetId": {
            "type": "string",
