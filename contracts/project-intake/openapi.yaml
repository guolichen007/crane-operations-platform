            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "code",
                "count",
                "amount"
              ],
              "properties": {
                "code": {
                  "type": "string",
                  "enum": [
                    "L0_LEAD",
                    "L1_REQUIREMENT",
                    "L2_TECHNICAL",
                    "L3_SITE_SURVEY",
                    "L4_SOLUTION",
                    "L5_QUOTATION",
                    "L6_TENDER",
                    "L7_COMMERCIAL",
                    "L8_PENDING_CONTRACT",
                    "WON",
                    "LOST",
                    "HOLD"
                  ]
                },
                "count": {
                  "type": "integer",
                  "minimum": 0
                },
                "amount": {
                  "$ref": "#/components/schemas/AmountSummary"
                }
              }
            }
          },
          "unclassified": {
            "type": "integer",
            "minimum": 0,
            "description": "库中 sales_stage 不属于 12 个标准编码的项目数（数据质量提示，不改写历史数据）；正常为 0"
          },
          "amount": {
            "$ref": "#/components/schemas/AmountSummary"
          },
          "unclassifiedAmount": {
            "$ref": "#/components/schemas/AmountSummary"
          }
        }
      },
      "AmountSummary": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "knownTotal",
          "knownCount",
          "knownZeroCount",
          "knownImplicitCount",
          "unknownCount",
          "legacyUnconfirmedCount",
          "invalidCount"
        ],
        "description": "G3-3B 项目预估金额（元）的已知部分，不是合同、收入、回款或预测。knownTotal 由 PostgreSQL numeric 求和，固定两位小数的十进制字符串，仅含 KNOWN；knownCount+unknownCount+legacyUnconfirmedCount+invalidCount 等于对应项目数。KNOWN 要求已知性合法且 estimated_amount 列与 document.estimatedAmount 数值精确相等；否则 INVALID（数据异常，不计入、不改写）。",
        "properties": {
          "knownTotal": {
            "type": "string",
            "pattern": "^[0-9]+\\.[0-9]{2}$",
            "description": "已知金额合计；无已知金额时为 \"0.00\"，须结合 knownCount 理解。由不限精度的 numeric 求和（R1 起不再受 numeric(20,2) 上限约束），可超过 18 位整数。"
          },
          "knownCount": {
            "type": "integer",
            "minimum": 0
          },
          "knownZeroCount": {
            "type": "integer",
            "minimum": 0,
            "description": "已确认的真实 0，属于 knownCount"
          },
          "knownImplicitCount": {
            "type": "integer",
            "minimum": 0,
            "description": "knownCount 中来自无已知性标记的历史正数（G1 兼容规则视为 KNOWN）"
          },
          "unknownCount": {
            "type": "integer",
            "minimum": 0
          },
          "legacyUnconfirmedCount": {
            "type": "integer",
            "minimum": 0,
            "description": "历史 0，未确认是否真实，不计入合计"
          },
          "invalidCount": {
            "type": "integer",
            "minimum": 0,
            "description": "已知性与数值矛盾、结构非法或两处金额不一致"
          }
        }
      },
      "StaffProvisionReview": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 600
          },
          "subject": {
            "type": "string",
            "description": "已存在的 Keycloak 用户 UUID（选填）。"
          },
          "username": {
            "type": "string",
            "maxLength": 64,
            "description": "企业账号用户名（选填，仅记录）。"
          }
        },
        "required": [
          "version",
          "reason"
        ]
      },
      "StaffProvisionReviewResult": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "member": {
            "$ref": "#/components/schemas/StaffMember"
          },
          "draft": {
            "type": "object",
            "description": "待身份核验草稿（draftStatus=PENDING_IDENTITY_VERIFICATION，identityVerified=false，approvalReference 以 BAOBEI-REVIEW- 开头）。staff-provision 拒绝该草稿；身份运维须独立核对 Keycloak 用户后写最终回执。"
          }
        },
        "required": [
          "member",
          "draft"
        ]
      },
      "StaffTeamLifecycle": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "name": {
            "type": "string"
          },
          "version": {
            "type": "integer"
          },
          "status": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "ARCHIVED"
            ]
          },
          "archivedAt": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "memberCount": {
            "type": "integer"
          },
          "openProjectCount": {
            "type": "integer"
          }
        }
      },
      "DraftLifecycleChange": {
        "type": "object",
        "required": [
          "version"
        ],
        "additionalProperties": false,
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string",
            "maxLength": 1000
          }
        },
        "description": "恢复原因选填（已发布契约不变）；提供时去除首尾空白，不超过 1000 字"
      },
      "DraftDiscard": {
        "type": "object",
        "required": [
          "version",
          "reason"
        ],
        "additionalProperties": false,
        "description": "废弃原因必填：去除首尾空白后非空，不超过 1000 字（G5-D1）",
        "properties": {
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 1000,
            "pattern": "\\S"
          }
        }
      },
      "ErrorDetails": {
        "type": "object",
        "description": "G5-D1：字段错误时 details.field 指明请求字段（如 reason、name、phone）；旧客户端忽略即可",
        "properties": {
          "field": {
            "type": "string"
          }
        }
      }
    },
    "responses": {
      "StaffInvalid": {
        "description": "输入错误",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffUnauthorized": {
        "description": "会话无效",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffForbidden": {
        "description": "超出范围或需重新认证",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffNotFound": {
        "description": "记录不存在或不可见",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffConflict": {
        "description": "版本、重复或状态冲突",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffMediaType": {
        "description": "请求格式错误",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "StaffUnavailable": {
        "description": "暂时不可用",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      }
    }
  }
}
