{
  "openapi": "3.0.3",
  "info": {
    "title": "Project Intake API",
    "version": "1.9.0-v11",
    "description": "全角色项目资源授权、不可覆盖提交证据、管理员未分配草稿及幂等创建；G2 增加审核资格提示、创建意图回执、显示名称与首页最小聚合。完整经营分析不在G2。 G4-S4：工作手机（新建必填、E.164）、邮箱选填、无邮箱以精确 subject 与唯一 Client Role 激活、管理员审核开通回执、仅敏感人员操作要求重新认证、本地/企业 SSO 退出与切换账号。 G4-S5-R1-F2/R2-P1：身份映射冲突拒绝、历史身份不可回退；撤销未完成开户、团队归档与恢复、草稿废弃与回收站恢复。 V1.1：主管本人报备（负责人=本人、团队取会话）由销售总监独立审核（reviewRoute=DIRECTOR，REVIEW_ROUTE_DIRECTOR）；按提交冻结不可变审核路由；主管只写本人项目；分层统计、项目中心、姓名完善。"
  },
  "servers": [
    {
      "url": "https://baobei.youdaozd.com"
    }
  ],
  "paths": {
    "/api/v1/me": {
      "get": {
        "operationId": "me",
        "summary": "me",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "permissions",
                    "businessActions"
                  ],
                  "properties": {
                    "permissions": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/StaffCapability"
                      }
                    },
                    "businessActions": {
                      "type": "object",
                      "additionalProperties": {
                        "$ref": "#/components/schemas/ActionHint"
                      },
                      "description": "导航能力提示：project.create/read/review/assign/unassigned、staff.manage、team.manage。仅用于界面入口，所有接口服务端重验。"
                    },
                    "profileCompleted": {
                      "type": "boolean",
                      "description": "V1.1：本人姓名已确认；false 时业务 API 返回 403 PROFILE_INCOMPLETE"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "输入错误",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "缺少会话 Cookie（UNAUTHENTICATED）或会话已失效（SESSION_EXPIRED）"
          },
          "403": {
            "description": "权限或CSRF不允许"
          },
          "404": {
            "description": "不可见或不存在"
          },
          "409": {
            "description": "版本或状态冲突"
          },
          "503": {
            "description": "服务暂不可用；输入保留，可重试"
          }
        }
      }
    },
    "/api/v1/projects": {
      "get": {
        "operationId": "projects.list",
        "summary": "projects.list",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "items",
                    "total"
                  ],
                  "properties": {
                    "items": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Project"
                      }
                    },
                    "total": {
                      "type": "integer"
                    },
                    "asOf": {
                      "type": "string",
                      "format": "date-time"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "筛选条件不支持或格式错误（INVALID_FILTER）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "未登录"
          },
          "403": {
            "description": "SCOPE_FORBIDDEN：角色无此统计范围",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "SCOPE_NOT_FOUND：成员/团队不存在或不可见（不区分）",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "版本或状态冲突"
          },
          "503": {
            "description": "服务暂不可用；输入保留，可重试"
          }
        },
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "客户、项目名称或报备编号"
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "DRAFT",
                "SUBMITTED",
                "UNDER_REVIEW",
                "APPROVED",
                "RETURNED",
                "REJECTED",
                "EXPIRED",
                "CANCELLED",
                "CONVERTED"
              ]
            }
          },
          {
            "name": "stage",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "L0_LEAD",
                "L1_REQUIREMENT",
                "L2_TECHNICAL",
                "L3_SITE_SURVEY",
                "L4_SOLUTION",
                "L5_QUOTATION",
                "L6_TENDER",
                "L7_COMMERCIAL",
                "L8_PENDING_CONTRACT",
                "WON",
                "LOST",
                "HOLD"
              ]
            },
            "description": "销售阶段（sales_stage），与报备状态 status 是不同维度；管道每栏用 stage+page+pageSize 独立分页"
          },
          {
            "name": "province",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "updatedAfter",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "updated",
                "name",
                "followup"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 1000000
            },
            "description": "正整数，默认1；非法值400 INVALID_FILTER"
          },
          {
            "name": "pageSize",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            },
            "description": "1–100，默认20；越界或非整数400 INVALID_FILTER"
          },
          {
            "name": "due",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "true"
              ]
            },
            "description": "兼容：下次跟进早于asOf+7天"
          },
          {
            "name": "followup",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "overdue",
                "upcoming",
                "today",
                "week",
                "unscheduled"
              ]
            },
            "description": "跟进窗口：overdue/upcoming（G2）；V1.1 today/week/unscheduled 为业务日（北京时间）窗口"
          },
          {
            "name": "assignment",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "assigned",
                "unassigned"
              ]
            },
            "description": "待分配草稿仅管理员范围可见"
          },
          {
            "name": "review",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "pending",
                "protection"
              ]
            }
          },
          {
            "name": "bin",
            "in": "query",
            "required": false,
            "description": "discarded=只看回收站中的草稿；缺省时列表、搜索与管道均排除回收站",
            "schema": {
              "type": "string",
              "enum": [
                "discarded"
              ]
            }
          },
          {
            "name": "scope",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "mine",
                "team",
                "member",
                "all"
              ]
            },
            "description": "V1.1 分层范围（服务端白名单）：销售 mine；主管 team/mine/member（仅本团队成员）；总监与管理员 all/team/member。总与 projectScope 取交集，只能缩小。"
          },
          {
            "name": "memberId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=member 时的人员编号（staff id）；不可见或不存在一律 404 SCOPE_NOT_FOUND"
          },
          {
            "name": "teamId",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "scope=team 时的团队；主管只能是本团队（可省略），总监/管理员必填"
          },
          {
            "name": "group",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "G1",
                "G2",
                "G3",
                "G4",
                "G5",
                "G6"
              ]
            },
            "description": "V1.1 六组展示分组（G1=L0/L1，G2=L2/L3，G3=L4/L5，G4=L6/L7，G5=L8，G6=WON/LOST/HOLD）；仅为 12 码集合筛选"
          },
          {
            "name": "lifecycle",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "open"
              ]
            },
            "description": "V1.1：仅进行中项目（同人员交接口径）"
          }
        ],
        "description": "统一ProjectPolicy范围内的列表。仅接受白名单筛选，未知参数或非法取值返回400 INVALID_FILTER。时间窗口共用响应中的asOf。 默认排序 updated_at DESC 后以 id 打破并列，分页稳定。"
      },
      "post": {
        "operationId": "projects.create",
        "summary": "projects.create",
        "security": [
          {
            "session": []
          }
        ],
        "requestBody": {
          "required": true,
