            "maxLength": 600
          },
          "projects": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "id": {
                  "type": "string",
                  "format": "uuid"
                },
                "version": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "required": [
                "id",
                "version"
              ]
            },
            "minItems": 1,
            "maxItems": 100
          }
        },
        "required": [
