{
  "openapi": "3.1.0",
  "info": {
    "title": "Crane Cloud API",
    "version": "1.0.0",
    "description": "Phase 0 development adapter. Production identity and remote/pointcloud are disabled."
  },
  "servers": [
    {
      "url": "/"
    }
  ],
  "security": [
    {
      "devBearer": []
    },
    {
      "devCookie": []
    }
  ],
  "paths": {
    "/api/v1/devices": {
      "get": {
        "operationId": "listDevices",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Shadow"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    },
    "/api/v1/devices/{id}": {
      "get": {
        "operationId": "getDevice",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Shadow"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    },
    "/api/v1/devices/{id}/shadow": {
      "get": {
        "operationId": "getShadow",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Shadow"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    },
    "/api/v1/devices/{id}/live-sessions": {
      "post": {
        "operationId": "openLiveSession",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "201": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LiveSession"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/live-sessions/{sessionId}/renew": {
      "post": {
        "operationId": "renewLiveSession",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LiveSession"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/live-sessions/{sessionId}": {
      "delete": {
        "operationId": "closeLiveSession",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "204": {
            "description": "Success"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/devices/{id}/remote-sessions": {
      "post": {
        "operationId": "openRemoteSession",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "501": {
            "description": "Phase 2 disabled"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/remote-sessions/{sessionId}": {
      "delete": {
        "operationId": "closeRemoteSession",
        "parameters": [
          {
            "name": "sessionId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "501": {
            "description": "Phase 2 disabled"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/alarms": {
      "get": {
        "operationId": "listAlarms",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Message"
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    },
    "/api/v1/auth/dev-session": {
      "post": {
        "operationId": "developmentSession",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "mode": {
                      "const": "development-only"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        },
        "x-audit": true
      }
    },
    "/api/v1/devices/{id}/stream": {
      "get": {
        "operationId": "streamShadow",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[A-Za-z0-9_-]{1,80}$"
            }
          }
        ],
        "responses": {
          "101": {
            "description": "Success"
          },
          "401": {
            "description": "Unauthorized"
          },
          "403": {
            "description": "Forbidden"
          },
          "404": {
            "description": "Not found"
          },
          "503": {
            "description": "Dependency unavailable"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "devBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Local random token; development only"
      },
      "devCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "crane_dev"
      }
    },
    "schemas": {
      "Message": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaVersion",
          "messageId",
          "tenantId",
          "projectId",
          "deviceId",
          "bootId",
          "sequence",
          "timestamp",
          "kind",
          "connectivity",
          "edgeHealth",
          "controllerHealth",
          "sensorHealth",
          "operatingState",
          "mode",
          "alarmState",
          "softwareVersion",
          "runtimeTotal",
          "x",
          "y",
          "z",
          "load",
          "sessionId",
          "ttlSeconds",
          "telemetryHz",
          "code",
          "text"
        ],
        "properties": {
          "schemaVersion": {
            "const": 1
          },
          "messageId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,80}$"
          },
          "tenantId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,80}$"
          },
          "projectId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,80}$"
          },
          "deviceId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,80}$"
          },
          "bootId": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{1,80}$"
          },
          "sequence": {
            "type": "integer",
            "minimum": 0
          },
          "timestamp": {
            "type": "string",
            "format": "date-time"
          },
          "kind": {
            "type": "string",
            "enum": [
              "BIRTH",
              "LWT",
              "HEARTBEAT",
              "SNAPSHOT",
              "LIVE",
              "ALARM",
              "EVENT",
              "WATCH_START",
              "WATCH_RENEW",
              "WATCH_STOP",
              "WATCH_ACK"
            ]
          },
          "connectivity": {
            "type": "string"
          },
          "edgeHealth": {
            "type": "string"
          },
          "controllerHealth": {
            "type": "string"
          },
          "sensorHealth": {
            "type": "string"
          },
          "operatingState": {
            "type": "string"
          },
          "mode": {
            "type": "string"
          },
          "alarmState": {
            "type": "string"
          },
          "softwareVersion": {
            "type": "string"
          },
          "runtimeTotal": {
            "type": "number"
          },
          "x": {
            "type": "number"
          },
          "y": {
            "type": "number"
          },
          "z": {
            "type": "number"
          },
          "load": {
            "type": "number"
          },
          "sessionId": {
            "type": "string"
          },
          "ttlSeconds": {
            "type": "integer"
          },
          "telemetryHz": {
            "type": "integer"
          },
          "code": {
            "type": "string"
          },
          "text": {
            "type": "string"
          }
        }
      },
      "Shadow": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "deviceId",
          "tenantId",
          "projectId",
          "reported",
          "updatedAt",
          "version"
        ],
        "properties": {
          "deviceId": {
            "type": "string"
          },
          "tenantId": {
            "type": "string"
          },
          "projectId": {
            "type": "string"
          },
          "reported": {
            "$ref": "#/components/schemas/Message"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "version": {
            "type": "integer"
          }
        }
      },
      "LiveSession": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sessionId",
          "deviceId",
          "userId",
          "expiresAt",
          "ttlSeconds",
          "telemetryHz"
        ],
        "properties": {
          "sessionId": {
            "type": "string"
          },
          "deviceId": {
            "type": "string"
          },
          "userId": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "ttlSeconds": {
            "type": "integer"
          },
          "telemetryHz": {
            "type": "integer"
          }
        }
      }
    }
  }
}
