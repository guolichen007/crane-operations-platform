name: u-dao-baobei
services:
  baobei-web:
    image: ${BAOBEI_WEB_IMAGE:?Pin the approved web image digest}
    restart: unless-stopped
    networks: [frontend, internal]
    volumes:
      - type: bind
        source: /srv/u-dao/platform/ingress/acme-webroot
        target: /var/www/acme
        read_only: true
        bind:
          create_host_path: false
    configs:
      - source: nginx-production
        target: /etc/nginx/conf.d/default.conf
      - source: nginx-proxy
        target: /etc/nginx/baobei-proxy.conf
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/health/ready]
      interval: 15s
      timeout: 3s
      retries: 5
  baobei-api:
    image: ${BAOBEI_API_IMAGE:?Pin the approved api image digest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEV_AUTH: '0'
      LISTEN_ADDR: 0.0.0.0:8088
      PUBLIC_ORIGIN: https://baobei.youdaozd.com
      OIDC_ISSUER: https://crane.youdaozd.com/realms/crane
      OIDC_CLIENT_ID: baobei-web
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      DATABASE_URL_FILE: /run/secrets/runtime_database_url
      STAFF_DATABASE_URL_FILE: /run/secrets/staff_database_url
    secrets: [oidc_client_secret, runtime_database_url, staff_database_url]
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      baobei-postgres: { condition: service_healthy }
  baobei-postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: baobei_bootstrap
      POSTGRES_DB: baobei
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    networks: [internal]
    volumes:
      - baobei-production-data:/var/lib/postgresql
      - type: bind
        source: ./db/initialize.sql
        target: /docker-entrypoint-initdb.d/10-baobei-roles.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/staff-role.sql
        target: /docker-entrypoint-initdb.d/20-baobei-staff-role.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, pg_isready -U baobei_bootstrap -d baobei]
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]
networks:
  frontend:
    name: u-dao-baobei-frontend
    external: true
  internal:
    name: u-dao-baobei-internal
    internal: true
  egress:
    name: u-dao-baobei-egress
secrets:
  oidc_client_secret:
    file: ${BAOBEI_SECRETS_DIR:?External secret directory}/oidc_client_secret
  runtime_database_url:
    file: ${BAOBEI_SECRETS_DIR:?External secret directory}/runtime_database_url
  staff_database_url:
    file: ${BAOBEI_SECRETS_DIR:?External secret directory}/staff_database_url
  db_password:
    file: ${BAOBEI_SECRETS_DIR:?External secret directory}/db_password
configs:
  nginx-production:
    file: ./nginx.production.conf
  nginx-proxy:
    file: ./nginx.proxy.production.conf
volumes:
  baobei-production-data:
