name: u-dao-baobei
services:
  baobei-postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: baobei
      POSTGRES_DB: baobei
      POSTGRES_PASSWORD: ${BAOBEI_DB_PASSWORD:?Use an ignored local env file}
    ports: ['127.0.0.1:55439:5432']
    volumes: ['baobei-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baobei -d baobei']
      interval: 3s
      timeout: 3s
      retries: 30
  baobei-web:
    build:
      context: ../../apps/project-intake-web
      dockerfile: ../../deploy/baobei/web.Dockerfile
      additional_contexts:
        baobei_config: .
    ports: ['127.0.0.1:5188:80']
    depends_on:
      baobei-postgres: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health/ready']
      interval: 5s
      timeout: 3s
      retries: 30
  baobei-api:
    build:
      context: ../../services/project-intake-api
      dockerfile: ../../deploy/baobei/api.Dockerfile
      args:
        GOPROXY: ${BAOBEI_GOPROXY:-https://proxy.golang.org,direct}
    network_mode: service:baobei-web
    environment:
      APP_ENV: development
      DEV_AUTH: '1'
      LISTEN_ADDR: 127.0.0.1:8088
      PUBLIC_ORIGIN: http://127.0.0.1:5188
      DATABASE_URL: postgres://baobei:${BAOBEI_DB_PASSWORD}@baobei-postgres:5432/baobei?sslmode=disable
    depends_on:
      baobei-web: { condition: service_started }
      baobei-postgres: { condition: service_healthy }
volumes:
  baobei-data:
