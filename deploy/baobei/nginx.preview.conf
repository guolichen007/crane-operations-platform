# G4-S1A Preview web (inside the preview web container). Included inside http{}.
# Same hardening as nginx.production.conf; Preview names only. No ACME webroot:
# the Preview certificate method is decided at deployment (doc 36 §7).
limit_req_zone $server_name zone=baobei_preview_login_global:1m rate=10r/s;
limit_req_zone $server_name zone=baobei_preview_callback_global:1m rate=20r/s;
server {
 listen 8080;
 server_name baobei-preview.youdaozd.com;
 access_log off;
 error_log /dev/stderr crit;
 client_max_body_size 64k;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $baobei_api http://baobei-preview-api:8088;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Robots-Tag "noindex, nofollow" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location ^~ /.well-known/ { return 404; }
 location = /auth/login {
  limit_req zone=baobei_preview_login_global burst=20 nodelay;
  limit_req_status 429;
  include /etc/nginx/baobei-proxy.conf;
 }
 location = /auth/callback {
  limit_req zone=baobei_preview_callback_global burst=40 nodelay;
  limit_req_status 429;
  include /etc/nginx/baobei-proxy.conf;
 }
 location ~ ^/(api/|auth/|health/) {include /etc/nginx/baobei-proxy.conf;}
 location / {try_files $uri $uri/ /index.html;}
}
