# Included inside http{}. No request/query/body logging, including callbacks.
limit_req_zone $server_name zone=baobei_login_global:1m rate=10r/s;
limit_req_zone $server_name zone=baobei_callback_global:1m rate=20r/s;
server {
 listen 8080;
 server_name baobei.youdaozd.com;
 access_log off;
 error_log /dev/stderr crit;
 client_max_body_size 64k;
 resolver 127.0.0.11 valid=10s ipv6=off;
 set $baobei_api http://baobei-api:8088;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
 location = /.well-known/acme-challenge { return 404; }
 location ^~ /.well-known/acme-challenge/ {
  if ($request_method !~ "^(GET|HEAD)$") {
   add_header Allow "GET, HEAD" always;
   return 405;
  }
  if ($request_uri !~ "^/[.]well-known/acme-challenge/[A-Za-z0-9_-]+([?].*)?$") { return 404; }
  root /var/www/acme;
  autoindex off;
  open_file_cache off;
  disable_symlinks on from=/var/www/acme;
  types {}
  default_type text/plain;
  add_header_inherit merge;
  add_header Cache-Control "no-store" always;
  try_files $uri =404;
 }
 location = /auth/login {
  limit_req zone=baobei_login_global burst=20 nodelay;
  limit_req_status 429;
  include /etc/nginx/baobei-proxy.conf;
 }
 location = /auth/callback {
  limit_req zone=baobei_callback_global burst=40 nodelay;
  limit_req_status 429;
  include /etc/nginx/baobei-proxy.conf;
 }
 location ~ ^/(api/|auth/|health/) {include /etc/nginx/baobei-proxy.conf;}
 location / {try_files $uri $uri/ /index.html;}
}
