worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  # Excludes query strings, Referer, Authorization, cookies and response bodies.
  log_format crane_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout crane_safe;
  map $http_upgrade $crane_connection { default upgrade; '' close; }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location ~ ^/(api|auth)/ {
      # OIDC code/state must not reach access logs.
      access_log off;
      proxy_pass http://cloud-api:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $crane_connection;
      # The outer ingress overwrites these. Only configured ingress peers are trusted by BFF.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
