worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  # Excludes query strings, Referer, Authorization, cookies and response bodies.
  log_format crane_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout crane_safe;
  map $http_upgrade $crane_connection { default upgrade; '' close; }
  # R5-UX-PERF caching tiers, decided by the final URI (after try_files).
  # Only Vite content-hashed build output may be cached for a year; everything
  # else revalidates (ETag / Last-Modified). API and auth responses get NO header
  # from this layer, so cloud-api's own Cache-Control (no-store) stays authoritative.
  # An empty value makes add_header emit nothing.
  map $uri $crane_cache_control {
    "~^/(api|auth)/"                                                       '';
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?|svg|png|jpe?g|webp)$" 'public, max-age=31536000, immutable';
    default                                                                'no-cache';
  }
  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # Server-level so every location inherits it together with the security headers
    # above (a location-level add_header would silently drop them).
    add_header Cache-Control $crane_cache_control always;
    # Compress static text only (HTML, JS, CSS, JSON/GeoJSON, SVG). The shared
    # ingress forwards Accept-Encoding; Vary keeps encoded and identity copies apart.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/javascript application/javascript application/json application/geo+json image/svg+xml application/manifest+json;
    location ~ ^/(api|auth)/ {
      # OIDC code/state must not reach access logs.
      access_log off;
      # Dynamic responses carry session/CSRF secrets: never compressed by this layer (BREACH).
      gzip off;
      proxy_pass http://cloud-api:8081;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $crane_connection;
      # The outer ingress overwrites these. Only configured ingress peers are trusted by BFF.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
    # A missing build chunk is a 404, never index.html served as JavaScript.
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
