name: Baobei CI
on:
  push:
    branches: ['product/baobei-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baobei-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baobei-contract:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - run: node tools/task.mjs baobei contract
      - run: python3 -m unittest discover -s tests/baobei/publish -v
      - run: python3 -B -m unittest discover -s tests/baobei/direct -v
      - run: python3 -B -m unittest discover -s tests/baobei/identity -v
  baobei-web-quality:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-contract]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: node tools/task.mjs baobei lint
      - run: npm test --prefix apps/project-intake-web
  baobei-api-test:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-contract]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: go test -race ./...
        working-directory: services/project-intake-api
  baobei-db-test:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-contract]
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: baobei
          POSTGRES_DB: baobei_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U baobei -d baobei_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      BAOBEI_TEST_DATABASE_URL: postgres://baobei@127.0.0.1:55439/baobei_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # G1 verifies the actual approved pre-migration source.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: node tools/task.mjs baobei race
      - run: node tools/task.mjs baobei integration
      - run: node tools/task.mjs baobei db-privileges
      - name: Root-only identity CLI ownership and database fixture
        run: |
          docker run --rm --network host -e BAOBEI_TEST_DATABASE_URL \
            -e GOPROXY=file:///go/pkg/mod/cache/download -e GOSUMDB=off \
            -v "$PWD/services/project-intake-api:/src:ro" \
            -v "$(go env GOMODCACHE)/cache/download:/cache:ro" \
            -w /src golang:1.27.4-alpine \
            sh -ec 'mkdir -p /go/pkg/mod/cache/download; cp -R /cache/. /go/pkg/mod/cache/download/; go test -mod=readonly -count=1 -run "TestIdentityRootFile|TestDatabaseIdentityCLI" -v ./...'
  baobei-e2e:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-web-quality, baobei-db-test]
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: baobei
          POSTGRES_DB: baobei_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U baobei -d baobei_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      BAOBEI_TEST_DATABASE_URL: postgres://baobei@127.0.0.1:55439/baobei_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: npx playwright install --with-deps chromium
        working-directory: apps/project-intake-web
      - run: npm run build --prefix apps/project-intake-web
      - name: Start synthetic application
        env:
          APP_ENV: development
          DEV_AUTH: '1'
          LISTEN_ADDR: 127.0.0.1:8088
          PUBLIC_ORIGIN: http://127.0.0.1:5188
          DATABASE_URL: postgres://baobei@127.0.0.1:55439/baobei_test?sslmode=disable
        run: |
          (cd services/project-intake-api && go run .) > /tmp/baobei-api.log 2>&1 &
          (cd apps/project-intake-web && node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5188 --strictPort --configLoader runner) > /tmp/baobei-web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/health/ready && curl --fail --silent http://127.0.0.1:5188/auth/config; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node tools/task.mjs baobei e2e
      - run: node tools/task.mjs baobei auth-e2e
  baobei-security:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-contract]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: node tools/task.mjs baobei security
      - run: node tests/baobei/security-snapshot.mjs
      - run: docker run --rm -v "$PWD/local-private/baobei/security-snapshot:/scan:ro" ghcr.io/gitleaks/gitleaks:v8.24.2 dir /scan --redact --no-banner
  baobei-compose:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-web-quality, baobei-api-test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - run: node tools/task.mjs baobei direct-check
      - run: node tools/task.mjs baobei cert-test
      - run: node tools/task.mjs baobei compose
      - run: node tools/task.mjs baobei up
      - run: node tools/task.mjs baobei http01-test
      - run: curl --fail http://127.0.0.1:5188/health/ready
      - run: node tools/task.mjs baobei restore-test
      - if: always()
        run: node tools/task.mjs baobei down
  baobei-build:
    if: startsWith(github.ref, 'refs/heads/product/baobei-')
    runs-on: ubuntu-latest
    needs: [baobei-contract]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: apps/project-intake-web/package-lock.json
      - run: npm ci --prefix apps/project-intake-web --ignore-scripts
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/project-intake-api/go.mod
          cache-dependency-path: services/project-intake-api/go.sum
      - run: node tools/task.mjs baobei build
      - run: BAOBEI_SOURCE_SHA=$(git rev-parse HEAD) node tools/task.mjs baobei docker-build
      - run: node tools/task.mjs baobei release
