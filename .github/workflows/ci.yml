name: Crane Platform CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: crane-ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '24.19.0', cache: npm }
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with: { go-version: '1.27.3', cache: true }
      - run: npm ci
      - run: node tools/diagnostics/repository.mjs
      - run: node tools/codegen/contracts.mjs --check && node tools/codegen/openapi.mjs --check
      - run: node --test tests/contract/contracts.test.mjs tests/contract/asset-runtime.test.mjs tests/contract/production-preflight.test.mjs
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - run: go test -race ./services/... ./internal/... ./contracts/... ./deploy/postgres/... ./tools/certs/... ./tools/identity/... ./tools/provision-keycloak/...
      - run: go vet ./...
      - run: test -z "$(gofmt -l contracts internal services edge simulators tools/certs tools/fleet tools/inventory tools/identity tools/provision-keycloak tools/diagnostics/mqtt-probe tests/integration deploy/postgres)"
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go build ./...
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - run: go test -race ./edge/... ./simulators/...
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 归档匿名Premium视觉证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: premium-ui-visual-${{ github.sha }}
          if-no-files-found: ignore
          path: test-results/premium-*/**/*.png
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SIM_COUNT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: node tools/task.mjs bootstrap
      - run: npx playwright install --with-deps chromium
      - run: node tools/task.mjs dev-up
      - run: node tools/task.mjs integration-test
      - if: failure()
        run: node tools/task.mjs dev-logs
      - if: always()
        run: node tools/task.mjs dev-down
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --redact
      - run: npm ci && npm audit --audit-level=high
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.74.0 fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /repo/node_modules /repo
      - run: docker build -f deploy/Dockerfile.backend -t crane-cloud:ci .
      - run: docker save crane-cloud:ci -o "$RUNNER_TEMP/crane-cloud.tar"
      - run: docker run --rm -v "$RUNNER_TEMP/crane-cloud.tar:/input.tar:ro" aquasec/trivy:0.74.0 image --input /input.tar --severity HIGH,CRITICAL --exit-code 1
  a1-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci
      - run: node tools/task.mjs production-contract
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ops
      - run: node tools/task.mjs a1-test
  production-release:
    needs: [repository-contract, backend, edge, frontend, integration, security, a1-security]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 登录当前仓库镜像注册表
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: 构建扫描并发布不可变镜像与SBOM
        if: github.event_name == 'push'
        run: node tools/task.mjs release
      - name: 使用发布的实际digest执行生产身份与备份恢复演练
        if: github.event_name == 'push'
        run: |
          A1_CLOUD_IMAGE=$(node -e "const m=require('./release/phase1-a1/release-manifest.json');const i=m.images.find(i=>i.image_name.endsWith('/cloud-api'));process.stdout.write(i.image_name+'@'+i.image_digest)")
          A1_WEB_IMAGE=$(node -e "const m=require('./release/phase1-a1/release-manifest.json');const i=m.images.find(i=>i.image_name.endsWith('/web-console'));process.stdout.write(i.image_name+'@'+i.image_digest)")
          export A1_CLOUD_IMAGE A1_WEB_IMAGE
          node tools/task.mjs a1-production-test
      - name: PR验证本地生产候选镜像
        if: github.event_name == 'pull_request'
        run: |
          docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -f deploy/Dockerfile.backend -t crane-a1-cloud:local .
          docker build --build-arg SOURCE_SHA="$GITHUB_SHA" -f deploy/Dockerfile.web-production -t crane-a1-web:local .
          node tools/task.mjs a1-production-test
      - name: 仅归档清单与SBOM
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crane-production-${{ github.sha }}
          if-no-files-found: error
          path: |
            release/phase1-a1/release-manifest.json
            release/phase1-a1/cloud-api.cdx.json
            release/phase1-a1/web-console.cdx.json
