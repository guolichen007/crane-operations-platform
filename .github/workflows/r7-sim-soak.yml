name: Crane R7 SIM Soak
# R7: 20 simulated devices for 60 minutes on real Mosquitto + PostgreSQL (same gate as the
# integration job, longer hold). Manual only; never deploys, never publishes, read-only token.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: soak minutes (20 devices)
        required: true
        default: '60'
permissions:
  contents: read
jobs:
  sim-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.4', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - run: npm ci
      - name: 20 台 × N 分钟真实云边模拟
        env:
          R7_SIM_SOAK_MINUTES: ${{ inputs.minutes }}
        run: |
          case "$R7_SIM_SOAK_MINUTES" in ''|*[!0-9]*) echo "minutes must be an integer"; exit 1;; esac
          node tools/r7-sim-e2e.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r7-sim-soak-${{ github.sha }}
          if-no-files-found: ignore
          path: test-results-r7/**
