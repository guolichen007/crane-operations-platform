name: Crane Dev Candidate
# D1: builds an immutable development candidate for https://crane.youdaozd.com from ONE exact SHA.
# Trigger: the OWNER pushes an annotated tag `dev/crane-<name>` on a commit whose full
# "Crane Platform CI" run (all nine required jobs) is already green. Tag pushes do not trigger
# ci.yml; this workflow never invokes the production publishing job, never writes the production
# image names, never deploys and never contacts a server. Images: ghcr.io/<repo>/dev/<name>:<sha>,
# consumed by digest only. Build success is NOT deployment approval.
on:
  push:
    tags: ['dev/crane-*']
permissions:
  contents: read
concurrency:
  group: crane-dev-candidate-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  dev-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - name: 同 SHA 九项 CI 必须全部 SUCCESS
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=50" \
            --jq '[.workflow_runs[] | select(.name=="Crane Platform CI" and .status=="completed" and .conclusion=="success")] | sort_by(.run_number) | last | .id // empty')
          if [ -z "$run_id" ]; then echo "No green Crane Platform CI run for ${GITHUB_SHA}"; exit 1; fi
          required='a1-security b4-business-acceptance backend edge frontend integration r2-db-test repository-contract security'
          got=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=50" \
            --jq '[.jobs[] | select(.conclusion=="success") | .name] | sort | join(" ")')
          for job in $required; do
            case " $got " in *" $job "*) ;; *) echo "Required CI job not SUCCESS: $job (run $run_id)"; exit 1;; esac
          done
          echo "ci_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "CI_GATE=PASS run=$run_id sha=${GITHUB_SHA}"
      - run: npm ci
      - name: 登录当前仓库镜像注册表
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: 复用生产构建链：构建、扫描、SBOM、按完整 SHA 推送 dev 命名空间
        env:
          CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
        run: node tools/dev-candidate.mjs
      - name: 归档开发候选清单、SBOM 与扫描结果
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: crane-dev-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            release/dev-candidate/dev-manifest.json
            release/dev-candidate/*.cdx.json
            release/dev-candidate/*.trivy.json
