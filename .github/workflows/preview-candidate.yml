name: H3 Preview Candidate
# Builds immutable Preview candidate images for one exact source SHA.
# Trigger: the OWNER pushes an annotated tag `preview/h3-<name>` that points to a commit whose
# full "Crane Platform CI" run (all nine required jobs) is already green. Tag pushes do not
# trigger ci.yml, and this workflow never invokes the production publishing job or script: images
# are published only as ghcr.io/<repo>/preview-cloud-api|preview-web-console:<full sha> and are
# consumed by digest. No `latest`, no deployment, no server access from CI.
on:
  push:
    tags: ['preview/h3-*']
permissions:
  contents: read
concurrency:
  group: h3-preview-candidate-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  preview-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with: { go-version: '1.27.3', cache: true }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: '24.19.0', cache: npm }
      - name: 同 SHA 九项 CI 必须全部 SUCCESS
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=50" \
            --jq '[.workflow_runs[] | select(.name=="Crane Platform CI" and .status=="completed" and .conclusion=="success")] | sort_by(.run_number) | last | .id // empty')
          if [ -z "$runs" ]; then echo "No green Crane Platform CI run for ${GITHUB_SHA}"; exit 1; fi
          required='a1-security b4-business-acceptance backend edge frontend integration r2-db-test repository-contract security'
          got=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${runs}/jobs?per_page=50" \
            --jq '[.jobs[] | select(.conclusion=="success") | .name] | sort | join(" ")')
          for job in $required; do
            case " $got " in *" $job "*) ;; *) echo "Required CI job not SUCCESS: $job (run $runs)"; exit 1;; esac
          done
          echo "ci_run_id=$runs" >> "$GITHUB_OUTPUT"
          echo "CI_GATE=PASS run=$runs sha=${GITHUB_SHA}"
      - run: npm ci
      - name: 登录当前仓库镜像注册表
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: 构建、扫描、SBOM、按完整 SHA 推送并固定 digest
        env:
          CI_RUN_ID: ${{ steps.gate.outputs.ci_run_id }}
        run: node tools/preview-candidate.mjs
      - name: 归档 Preview 候选清单、SBOM 与扫描结果
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h3-preview-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            release/h3-preview/preview-manifest.json
            release/h3-preview/preview-images.env
            release/h3-preview/*.cdx.json
            release/h3-preview/*.trivy.json
            release/h3-preview/uatdata-linux-amd64
